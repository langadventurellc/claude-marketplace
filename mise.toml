[tools]
node = "22"

[tasks.lint]
description = "Lint the MCP server"
run = "npm --prefix plugins/jira-issue-orchestration/mcp-server run lint"

[tasks.type-check]
description = "TypeScript type check"
run = "npm --prefix plugins/jira-issue-orchestration/mcp-server run type-check"

[tasks.test]
description = "Run all tests"
run = "npm --prefix plugins/jira-issue-orchestration/mcp-server run test"

[tasks.format]
description = "Format TS, Markdown, and JSON across the repo"
run = "npx prettier --write \"**/*.{ts,md,json}\""

[tasks.format-check]
description = "Check formatting without writing changes"
run = "npx prettier --check \"**/*.{ts,md,json}\""

[tasks.quality]
description = "Aggregate quality gate (lint + type-check + format-check)"
depends = ["lint", "type-check", "format-check"]

[tasks.bundle]
description = "Bundle the MCP server into a single self-contained JS file"
run = "npm --prefix plugins/jira-issue-orchestration/mcp-server run bundle"

[tasks.install-hooks]
description = "Point git at .githooks/ so commit-time bundling runs"
run = "git config core.hooksPath .githooks"
